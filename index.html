<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111a3b">
  <meta name="description" content="Rocket Hopper: jump, fly, duck, and kick winged space mushrooms!">
  <title>Rocket Hopper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><span>ROCKET <b>HOPPER</b></span></div>
      <button id="sound-button" class="icon-button" type="button" aria-label="Mute sound" title="Toggle sound">♪</button>
    </header>

    <section class="game-frame" aria-label="Rocket Hopper game">
      <canvas id="game" width="960" height="540" aria-label="Astronaut running past winged jumping mushrooms"></canvas>
      <div class="hud" aria-live="polite">
        <div class="score-card"><span>SCORE</span><strong id="score">0000</strong></div>
        <div class="fuel-wrap"><span>ROCKET FUEL</span><div class="fuel-track"><div id="fuel-fill" class="fuel-fill"></div></div></div>
        <div class="score-card best-card"><span>BEST</span><strong id="best">0000</strong></div>
      </div>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="badge">✦ A SPACE ADVENTURE ✦</div>
          <h1 id="overlay-title">Rocket<br><em>Hopper!</em></h1>
          <p id="overlay-text">Jump, fly, duck, or kick the winged mushrooms away!</p>
          <div class="mini-controls"><span>↥ <b>Tap</b> to jump</span><span>🚀 <b>Hold</b> to fly</span><span>↓ <b>Duck</b></span><span>✦ <b>Kick</b> away</span></div>
          <button id="play-button" class="play-button" type="button">LET’S PLAY <span aria-hidden="true">➜</span></button>
        </div>
      </div>
      <div id="pause-label" class="pause-label" hidden>PAUSED <small>Press P to keep playing</small></div>
    </section>

    <div class="bottom-row">
      <div class="keyboard-tip"><span class="key">SPACE</span> jump / fly <span class="dot">·</span> <span class="key">↓</span> duck <span class="dot">·</span> <span class="key">K</span> kick <span class="dot">·</span> <span class="key">P</span> pause</div>
      <div class="touch-controls"><button id="jump-button" class="control-button jump-button" type="button" aria-label="Jump and fly">🚀 <span>JUMP / FLY</span></button><button id="duck-button" class="control-button duck-button" type="button" aria-label="Duck">↓ <span>DUCK</span></button><button id="kick-button" class="control-button kick-button" type="button" aria-label="Kick mushrooms away">✦ <span>KICK</span></button></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
